name: Targeta del perfil

on:
  schedule:
    - cron: "17 4 * * *"   # cada dia a les 06:17 hora de Barcelona (04:17 UTC)
  push:
    branches: [main]
  workflow_dispatch:        # per llançar-la a mà des de la pestanya Actions

permissions:
  contents: write

concurrency:
  group: profile-card
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests pillow

      - name: Regenerar els SVG
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python today.py

      - name: Publicar els canvis
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add light_mode.svg dark_mode.svg cache/
          git diff --staged --quiet || git commit -m "targeta: dades de $(date -u +%Y-%m-%d)"
          git push
